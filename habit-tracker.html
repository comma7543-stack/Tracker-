<title>Habit Tracker</title>

<style>
/* ================================================================
   THEME — strict black & white.
   Change these variables to re-tint the whole app.
   ================================================================ */
:root{
  --bg:        #000000;   /* page background            */
  --card:      #0b0b0b;   /* card surfaces              */
  --card2:     #111111;   /* nested surfaces            */
  --line:      #1f1f1f;   /* hairline borders           */
  --line-hi:   #3a3a3a;   /* brighter border (active)   */
  --txt:       #f2f2f2;   /* primary text               */
  --muted:     #9a9a9a;   /* secondary text             */
  --dim:       #5a5a5a;   /* tertiary text              */
  --glow:      0 0 24px rgba(255,255,255,.07);            /* soft card glow  */
  --glow-hi:   0 0 18px rgba(255,255,255,.18);            /* active glow     */
  --radius:    18px;
  --tap:       44px;      /* minimum iOS tap target     */
}

*{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html{
  background:var(--bg);
  /* Disable pull-to-refresh / rubber-band wiping state */
  overscroll-behavior:none;
}

body{
  background:var(--bg);
  color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;
  line-height:1.5;
  min-height:100vh;
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
  /* Prevent accidental text selection on taps (re-enabled on inputs below) */
  -webkit-user-select:none;
  user-select:none;
  /* keep iOS from auto-inflating text on rotate */
  -webkit-text-size-adjust:100%;
}

/* Text entry areas DO allow selection */
input, textarea, [contenteditable]{
  -webkit-user-select:text;
  user-select:text;
}

/* Faint radial "light source" behind everything */
.bg-light{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(ellipse 90% 55% at 50% -12%, rgba(255,255,255,.09), transparent 62%),
    radial-gradient(ellipse 60% 40% at 85% 108%, rgba(255,255,255,.04), transparent 60%);
}

/* ================================================================
   LAYOUT — single centered column, safe-area aware
   ================================================================ */
.wrap{
  position:relative; z-index:1;
  max-width:680px;
  margin:0 auto;
  padding:calc(env(safe-area-inset-top, 0px) + 18px)
          calc(env(safe-area-inset-right, 0px) + 16px)
          calc(env(safe-area-inset-bottom, 0px) + 108px)   /* room for tab bar */
          calc(env(safe-area-inset-left, 0px) + 16px);
}

.view{ display:none; animation:fadeUp .28s ease; }
.view.on{ display:block; }
@keyframes fadeUp{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }

/* ================================================================
   CARDS
   ================================================================ */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:20px;
  margin-bottom:18px;
  box-shadow:var(--glow);
  transition:border-color .25s ease, box-shadow .25s ease;
}
@media (hover:hover){
  .card:hover{ border-color:var(--line-hi); }
}

.card h3{
  font-size:13px; font-weight:600; letter-spacing:.14em;
  text-transform:uppercase; color:var(--muted); margin-bottom:14px;
}

.muted{ color:var(--muted); }
.dim{ color:var(--dim); }
.small{ font-size:13px; }

/* ================================================================
   VERSE OF THE DAY
   ================================================================ */
.verse-card{ text-align:center; padding:26px 22px; }
.verse-text{
  font-size:17px; line-height:1.65; color:var(--txt);
  font-weight:400; font-style:italic;
  text-shadow:0 0 22px rgba(255,255,255,.22);   /* subtle glow on the verse */
}
.verse-ref{
  margin-top:10px; font-size:12px; letter-spacing:.18em;
  text-transform:uppercase; color:var(--muted);
}

/* ================================================================
   TODAY HEADER + DAILY RING
   ================================================================ */
.today-head{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
}
.today-head h2{ font-size:22px; font-weight:700; letter-spacing:-.01em; }

.ring{ position:relative; width:92px; height:92px; flex:none; }
.ring svg{ width:100%; height:100%; transform:rotate(-90deg); }
.ring-bg{ fill:none; stroke:var(--line); stroke-width:9; }
.ring-fg{
  fill:none; stroke:#ffffff; stroke-width:9; stroke-linecap:round;
  filter:drop-shadow(0 0 6px rgba(255,255,255,.55));    /* glowing arc */
  transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1);
}
.ring-pct{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:19px; font-weight:700;
}

/* ================================================================
   LIST ROWS (habits + goals) — every row is a >=52px tap target
   ================================================================ */
.rows{ list-style:none; }
.row{
  display:flex; align-items:center; gap:14px;
  min-height:52px; padding:6px 4px;
  border-bottom:1px solid var(--line);
  cursor:pointer;
  transition:background .2s ease;
}
.row:last-child{ border-bottom:none; }
.row:active{ background:rgba(255,255,255,.05); }
@media (hover:hover){ .row:hover{ background:rgba(255,255,255,.04); } }

/* circular check indicator */
.chk{
  width:30px; height:30px; flex:none; border-radius:50%;
  border:2px solid var(--dim);
  display:flex; align-items:center; justify-content:center;
  font-size:15px; color:#000;
  transition:all .22s ease;
}
.row.done .chk{
  background:#ffffff; border-color:#ffffff;
  box-shadow:0 0 12px rgba(255,255,255,.45);   /* glow when completed */
}
.row .label{ flex:1; font-size:17px; transition:color .22s ease, opacity .22s ease; }
.row.done .label{ color:var(--dim); text-decoration:line-through; }

/* small square icon buttons inside rows (edit mode / goal delete) */
.ibtn{
  width:var(--tap); height:var(--tap); flex:none;
  display:flex; align-items:center; justify-content:center;
  background:var(--card2); color:var(--muted);
  border:1px solid var(--line); border-radius:12px;
  font-size:17px; cursor:pointer;
  transition:all .2s ease;
}
.ibtn:active{ background:#1d1d1d; color:#fff; }
@media (hover:hover){
  .ibtn:hover{ color:#fff; border-color:var(--line-hi); box-shadow:var(--glow-hi); }
}
.ibtn:disabled{ opacity:.25; pointer-events:none; }

/* ================================================================
   ADD ROW + BUTTONS
   ================================================================ */
.add-row{ display:flex; gap:10px; margin-top:14px; }
.add-row input{
  flex:1; min-width:0;
  background:var(--card2); color:var(--txt);
  border:1px solid var(--line); border-radius:14px;
  padding:12px 15px; font-size:16px;   /* 16px = no iOS zoom */
  outline:none; transition:border-color .2s ease, box-shadow .2s ease;
}
.add-row input:focus{ border-color:var(--line-hi); box-shadow:var(--glow-hi); }
.add-row input::placeholder{ color:var(--dim); }

.btn{
  min-height:var(--tap); padding:0 20px;
  background:#ffffff; color:#000;
  border:none; border-radius:14px;
  font-size:15px; font-weight:600; cursor:pointer;
  transition:all .2s ease;
}
.btn:active{ transform:scale(.96); }
@media (hover:hover){ .btn:hover{ box-shadow:0 0 18px rgba(255,255,255,.35); } }

.btn.ghost{
  background:transparent; color:var(--muted);
  border:1px solid var(--line);
}
.btn.ghost:active{ color:#fff; }
@media (hover:hover){ .btn.ghost:hover{ color:#fff; border-color:var(--line-hi); box-shadow:var(--glow-hi); } }
.btn.ghost.on{ color:#fff; border-color:var(--line-hi); box-shadow:var(--glow-hi); }

.card-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.card-head h3{ margin-bottom:0; }
.card-head .btn{ min-height:36px; padding:0 14px; font-size:13px; }

/* ================================================================
   PROGRESS BARS
   ================================================================ */
.bar-row{ margin-bottom:14px; }
.bar-row:last-child{ margin-bottom:0; }
.bar-top{ display:flex; justify-content:space-between; font-size:14px; margin-bottom:6px; }
.bar{
  height:8px; border-radius:99px; background:var(--card2);
  border:1px solid var(--line); overflow:hidden;
}
.bar > span{
  display:block; height:100%; border-radius:99px;
  background:linear-gradient(90deg,#bfbfbf,#ffffff);
  box-shadow:0 0 10px rgba(255,255,255,.4);
  transition:width .6s cubic-bezier(.4,0,.2,1);
}
.bar-row.overall .bar{ height:12px; }
.bar-row.overall .bar-top{ font-size:15px; font-weight:600; }

/* ================================================================
   MONTH / YEAR NAVIGATION
   ================================================================ */
.nav-line{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.nav-line h2{ font-size:19px; font-weight:700; }
.nav-btn{
  width:var(--tap); height:var(--tap);
  background:var(--card2); color:var(--txt);
  border:1px solid var(--line); border-radius:12px;
  font-size:20px; cursor:pointer; transition:all .2s ease;
}
.nav-btn:active{ background:#1d1d1d; }
@media (hover:hover){ .nav-btn:hover{ border-color:var(--line-hi); box-shadow:var(--glow-hi); } }

.big-stat{ display:flex; align-items:baseline; gap:10px; margin-bottom:16px; }
.big-stat .num{ font-size:38px; font-weight:800; text-shadow:0 0 26px rgba(255,255,255,.3); }

/* ================================================================
   CALENDAR GRID — fits narrow screens; cells are square taps
   ================================================================ */
.cal-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
.cal-head, .cal-grid{
  display:grid; grid-template-columns:repeat(7,1fr); gap:6px; min-width:308px;
}
.cal-head{ margin-bottom:6px; }
.cal-head span{ text-align:center; font-size:11px; letter-spacing:.08em; color:var(--dim); text-transform:uppercase; }
.cal-cell{
  aspect-ratio:1; min-height:38px;
  display:flex; align-items:center; justify-content:center;
  border-radius:11px; border:1px solid var(--line);
  font-size:14px; font-weight:600; color:var(--muted);
  cursor:pointer; transition:all .2s ease;
}
.cal-cell.blank{ border:none; cursor:default; }
.cal-cell.future{ opacity:.3; cursor:default; }
.cal-cell.today{ border-color:#fff; box-shadow:0 0 12px rgba(255,255,255,.35); }
.cal-cell:not(.blank):not(.future):active{ transform:scale(.93); }
@media (hover:hover){
  .cal-cell:not(.blank):not(.future):hover{ border-color:var(--line-hi); box-shadow:var(--glow-hi); }
}

.legend{ display:flex; align-items:center; gap:6px; margin-top:14px; }
.legend .sw{ width:18px; height:18px; border-radius:5px; border:1px solid var(--line); }

/* Year view month tiles */
.year-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.month-tile{
  border:1px solid var(--line); border-radius:14px;
  padding:14px 8px; text-align:center; cursor:pointer;
  background:var(--card2); transition:all .2s ease;
}
.month-tile:active{ transform:scale(.95); }
@media (hover:hover){ .month-tile:hover{ border-color:var(--line-hi); box-shadow:var(--glow-hi); } }
.month-tile .mname{ font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
.month-tile .mpct{ font-size:19px; font-weight:700; margin-top:5px; }
.month-tile .mbar{ height:5px; border-radius:99px; background:#000; margin-top:9px; overflow:hidden; }
.month-tile .mbar span{ display:block; height:100%; background:#fff; border-radius:99px; box-shadow:0 0 8px rgba(255,255,255,.5); }

/* ================================================================
   JOURNAL
   ================================================================ */
.fmt-bar{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
.fmt-bar select{
  min-height:var(--tap);
  background:var(--card2); color:var(--txt);
  border:1px solid var(--line); border-radius:12px;
  padding:0 10px; font-size:16px; outline:none;
  transition:border-color .2s ease;
  -webkit-appearance:none; appearance:none;
}
.fmt-bar select:focus{ border-color:var(--line-hi); }
.fmt-group{ display:flex; gap:6px; }

#journalText{
  width:100%; min-height:170px; resize:vertical;
  background:var(--card2); color:var(--txt);
  border:1px solid var(--line); border-radius:14px;
  padding:14px 15px; font-size:16px; line-height:1.6;
  outline:none; transition:border-color .25s ease, box-shadow .25s ease;
}
#journalText:focus{ border-color:var(--line-hi); box-shadow:var(--glow-hi); }
#journalText::placeholder{ color:var(--dim); }
.save-note{ margin-top:8px; font-size:12px; color:var(--dim); min-height:16px; transition:opacity .4s ease; }

/* ================================================================
   BOTTOM TAB BAR — fixed, blurred, safe-area padded (home indicator)
   ================================================================ */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:50;
  display:flex; justify-content:center; gap:8px;
  padding:10px 16px calc(env(safe-area-inset-bottom, 0px) + 10px);
  background:rgba(0,0,0,.72);
  -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px);
  border-top:1px solid var(--line);
}
.tab{
  flex:1; max-width:150px; min-height:48px;
  background:transparent; color:var(--muted);
  border:1px solid transparent; border-radius:14px;
  font-size:15px; font-weight:600; cursor:pointer;
  transition:all .22s ease;
}
.tab.on{
  color:#fff; border-color:var(--line-hi);
  background:rgba(255,255,255,.06);
  box-shadow:var(--glow-hi);
}

/* ================================================================
   DAY DETAIL MODAL — bottom sheet on mobile
   ================================================================ */
.overlay{
  position:fixed; inset:0; z-index:100;
  background:rgba(0,0,0,.72);
  -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  display:none; align-items:flex-end; justify-content:center;
}
.overlay.on{ display:flex; }
.sheet{
  width:100%; max-width:680px; max-height:86vh; overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  background:var(--card);
  border:1px solid var(--line-hi); border-bottom:none;
  border-radius:22px 22px 0 0;
  padding:22px 20px calc(env(safe-area-inset-bottom, 0px) + 26px);
  box-shadow:0 -8px 50px rgba(255,255,255,.08);
  animation:sheetUp .3s cubic-bezier(.3,.9,.3,1);
}
@keyframes sheetUp{ from{ transform:translateY(60px); opacity:0; } to{ transform:none; opacity:1; } }
.sheet-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.sheet-head h2{ font-size:19px; }
.sheet h4{
  font-size:12px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--muted); margin:18px 0 8px;
}
.sheet .rows .row{ cursor:default; }
.journal-view{
  background:var(--card2); border:1px solid var(--line); border-radius:14px;
  padding:14px 15px; line-height:1.6; white-space:pre-wrap; word-break:break-word;
  -webkit-user-select:text; user-select:text;
}

/* wider screens: modal becomes a centered dialog */
@media (min-width:700px){
  .overlay{ align-items:center; padding:24px; }
  .sheet{ border-radius:22px; border-bottom:1px solid var(--line-hi); }
}

/* Import/export row */
.data-row{ display:flex; gap:10px; flex-wrap:wrap; }
.data-row .btn{ flex:1; }

/* ================================================================
   IN-APP DIALOG (replaces alert/confirm/prompt, which some embedded
   browsers block) — centered box reusing the overlay backdrop
   ================================================================ */
.overlay.center{ align-items:center; padding:24px; }
.dialog{
  width:100%; max-width:340px;
  background:var(--card); border:1px solid var(--line-hi);
  border-radius:20px; padding:22px;
  box-shadow:0 0 44px rgba(255,255,255,.1);
  animation:sheetUp .22s cubic-bezier(.3,.9,.3,1);
}
.dialog p{ margin-bottom:16px; line-height:1.5; }
.dialog input{
  width:100%; margin-bottom:16px;
  background:var(--card2); color:var(--txt);
  border:1px solid var(--line); border-radius:14px;
  padding:12px 15px; font-size:16px;   /* 16px = no iOS zoom */
  outline:none;
}
.dialog input:focus{ border-color:var(--line-hi); box-shadow:var(--glow-hi); }
.dlg-btns{ display:flex; gap:10px; }
.dlg-btns .btn{ flex:1; }
</style>
</head>
<body>

<!-- faint radial light source behind the app -->
<div class="bg-light"></div>

<div class="wrap">

  <!-- ==================== VERSE OF THE DAY ==================== -->
  <div class="card verse-card">
    <p class="verse-text" id="verseText"></p>
    <p class="verse-ref" id="verseRef"></p>
  </div>

  <!-- ======================= TODAY VIEW ======================= -->
  <section class="view on" id="view-today">

    <!-- date + daily completion ring -->
    <div class="card">
      <div class="today-head">
        <div>
          <h2 id="todayLabel"></h2>
          <p class="muted small" id="todaySub"></p>
        </div>
        <div class="ring">
          <svg viewBox="0 0 100 100">
            <circle class="ring-bg" cx="50" cy="50" r="42"></circle>
            <circle class="ring-fg" id="dayRing" cx="50" cy="50" r="42"></circle>
          </svg>
          <span class="ring-pct" id="dayRingPct">0%</span>
        </div>
      </div>
    </div>

    <!-- HABITS: permanent daily checklist -->
    <div class="card">
      <div class="card-head">
        <h3>Habits</h3>
        <button class="btn ghost" id="habitEditBtn">Edit</button>
      </div>
      <ul class="rows" id="habitList"></ul>
      <div class="add-row">
        <input type="text" id="habitInput" placeholder="New habit…" maxlength="60" autocomplete="off">
        <button class="btn" id="habitAddBtn">Add</button>
      </div>
    </div>

    <!-- DAILY GOALS: fresh list every day, history kept -->
    <div class="card">
      <h3>Today's Goals</h3>
      <ul class="rows" id="goalList"></ul>
      <div class="add-row">
        <input type="text" id="goalInput" placeholder="Goal for today…" maxlength="80" autocomplete="off">
        <button class="btn" id="goalAddBtn">Add</button>
      </div>
    </div>

    <!-- JOURNAL: one entry per day, autosaved, with formatting -->
    <div class="card">
      <h3>Journal</h3>
      <div class="fmt-bar">
        <select id="jFont" title="Font family">
          <option value="system">System</option>
          <option value="serif">Serif</option>
          <option value="mono">Mono</option>
          <option value="cursive">Cursive</option>
        </select>
        <select id="jSize" title="Font size">
          <option value="16">16px</option>
          <option value="18">18px</option>
          <option value="20">20px</option>
          <option value="24">24px</option>
        </select>
        <select id="jColor" title="Text colour">
          <option value="#f2f2f2">White</option>
          <option value="#bdbdbd">Light grey</option>
          <option value="#8a8a8a">Grey</option>
          <option value="#5a5a5a">Dark grey</option>
        </select>
        <div class="fmt-group">
          <!-- alignment icons drawn as tiny inline SVGs (three bars) -->
          <button class="ibtn" id="jAlignL" title="Align left">
            <svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 2h16M1 7h10M1 12h13"/></svg>
          </button>
          <button class="ibtn" id="jAlignC" title="Align centre">
            <svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 2h16M4 7h10M2.5 12h13"/></svg>
          </button>
          <button class="ibtn" id="jAlignR" title="Align right">
            <svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 2h16M7 7h10M4 12h13"/></svg>
          </button>
        </div>
      </div>
      <textarea id="journalText" placeholder="What did you do today? How did it go?"></textarea>

<script>
/* ================================================================

/* ================================================================
   DATE HELPERS
   All data is keyed by LOCAL date string "YYYY-MM-DD".
   ================================================================ */
const pad = n => String(n).padStart(2, "0");
const keyFor = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayKey = () => keyFor(new Date());
const parseKey = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); };
const daysInMonth = (y, m) => new Date(y, m+1, 0).getDate();  // m = 0-11
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const MONTHS_S = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

/* ================================================================
   STATE + PERSISTENCE (localStorage)

   state = {
     habits:   [ {id, name, created:"YYYY-MM-DD"} ]   ordered list
     archived: { habitId: name }        names of deleted habits (for history)
     checks:   { "YYYY-MM-DD": [habitId, ...] }       habits done that day
     goals:    { "YYYY-MM-DD": [ {id, text, done} ] } goals for that day
     journal:  { "YYYY-MM-DD": {text, font, size, color, align} }
     stats:    { "YYYY-MM-DD": {done, total} }        archived day snapshot
   }
   ================================================================ */
const STORE_KEY = "bw-habit-tracker-v1";

function defaultState(){
  return { habits:[], archived:{}, checks:{}, goals:{}, journal:{}, stats:{} };
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return defaultState();
    const s = Object.assign(defaultState(), JSON.parse(raw));
    return s;
  }catch(e){
    console.error("Could not load saved data:", e);
    return defaultState();
  }
}

function save(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  }catch(e){
    console.error("Saving failed (storage may be full):", e);
  }
}

let state = loadState();
let currentDay = todayKey();      // watched for midnight rollover
let habitEditMode = false;        // Today view: edit habits on/off
let monthCursor = new Date();     // which month the Month view shows
let yearCursor = new Date().getFullYear();

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const $  = id => document.getElementById(id);

/* Escape user text before inserting into HTML */
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

/* ================================================================
   IN-APP DIALOGS
   window.alert/confirm/prompt are blocked in some embedded browsers
   (sandboxed iframes, previews), so the app uses its own dialog box.
   Each helper returns a Promise:
     appAlert(msg)          -> resolves true when dismissed
     appConfirm(msg)        -> resolves true (OK) / false (Cancel)
     appPrompt(msg, value)  -> resolves the string, or null on Cancel
   ================================================================ */
let dlgResolve = null;

function showDialog(message, { input = null, cancel = true, okText = "OK" } = {}){
  return new Promise(resolve => {
    dlgResolve = resolve;
    $("dlgMsg").textContent = message;
    const inp = $("dlgInput");
    if(input === null){
      inp.style.display = "none";
    } else {
      inp.style.display = "block";
      inp.value = input;
    }
    $("dlgCancel").style.display = cancel ? "" : "none";
    $("dlgOk").textContent = okText;
    $("dlgOverlay").classList.add("on");
    if(input !== null) setTimeout(() => { inp.focus(); inp.select(); }, 60);
  });
}

function closeDialog(ok){
  $("dlgOverlay").classList.remove("on");
  if(!dlgResolve) return;
  const hadInput = $("dlgInput").style.display !== "none";
  dlgResolve(ok ? (hadInput ? $("dlgInput").value : true)
               : (hadInput ? null : false));
  dlgResolve = null;
}

const appAlert   = msg => showDialog(msg, { cancel:false });
const appConfirm = msg => showDialog(msg);
const appPrompt  = (msg, value = "") => showDialog(msg, { input: value });

/* ================================================================
   DAY STATS
   A day's completion = (habits checked + goals done) / (habits that
   existed that day + goals added that day).
   Today's numbers are recomputed live and snapshotted into
   state.stats so history survives later habit deletions.
   ================================================================ */
function habitsForDay(dayKey){
  // habits whose creation date is on or before this day
  return state.habits.filter(h => (h.created || "0000") <= dayKey);
}

function computeDayStats(dayKey){
  const habits = habitsForDay(dayKey);
  const checked = (state.checks[dayKey] || []).filter(id => habits.some(h => h.id === id));
  const goals = state.goals[dayKey] || [];
  const total = habits.length + goals.length;
  const done  = checked.length + goals.filter(g => g.done).length;
  return { done, total };
}

/* Called after every change to today's data: snapshot + persist */
function commitToday(){
  state.stats[currentDay] = computeDayStats(currentDay);
  save();
}

/* Stats for any day: prefer the archived snapshot, else recompute */
function statsFor(dayKey){
  if(dayKey !== currentDay && state.stats[dayKey]) return state.stats[dayKey];
  return computeDayStats(dayKey);
}

function pctFor(dayKey){
  const s = statsFor(dayKey);
  return s.total === 0 ? null : Math.round(s.done / s.total * 100);
}

/* ================================================================
   VERSE OF THE DAY
   ================================================================ */
function renderVerse(){
  const d = parseKey(currentDay);
  const days = Math.floor(d.getTime() / 86400000);      // days since epoch
  const [text, ref] = VERSES[((days % VERSES.length) + VERSES.length) % VERSES.length];
  $("verseText").textContent = "“" + text + "”";
  $("verseRef").textContent = ref;
}

/* ================================================================
   TODAY VIEW — header + daily ring
   ================================================================ */
const RING_LEN = 2 * Math.PI * 42;   // circumference of the SVG ring (r=42)

function renderTodayHeader(){
  const d = parseKey(currentDay);
  $("todayLabel").textContent = d.toLocaleDateString(undefined,
    { weekday:"long", month:"long", day:"numeric" });
  const s = computeDayStats(currentDay);
  $("todaySub").textContent = s.total === 0
    ? "Add habits and goals below"
    : `${s.done} of ${s.total} complete`;
  const pct = s.total === 0 ? 0 : s.done / s.total;
  const ring = $("dayRing");
  ring.style.strokeDasharray = RING_LEN;
  ring.style.strokeDashoffset = RING_LEN * (1 - pct);
  $("dayRingPct").textContent = Math.round(pct * 100) + "%";
}

/* ================================================================
   HABITS — add / edit (rename, reorder, delete) / daily check-off
   ================================================================ */
function renderHabits(){
  const list = $("habitList");
  const checked = state.checks[currentDay] || [];
  list.innerHTML = "";

  if(state.habits.length === 0){
    list.innerHTML = '<li class="dim small" style="padding:10px 4px">No habits yet — add your first one below.</li>';
  }

  state.habits.forEach((h, i) => {
    const li = document.createElement("li");
    li.className = "row" + (checked.includes(h.id) ? " done" : "");

    if(habitEditMode){
      // Edit mode: reorder / rename / delete controls (all 44px targets)
      li.style.cursor = "default";
      li.innerHTML = `
        <span class="label">${esc(h.name)}</span>
        <button class="ibtn" data-act="up"   ${i===0 ? "disabled" : ""} title="Move up">↑</button>
        <button class="ibtn" data-act="down" ${i===state.habits.length-1 ? "disabled" : ""} title="Move down">↓</button>
        <button class="ibtn" data-act="ren"  title="Rename">✎</button>
        <button class="ibtn" data-act="del"  title="Delete">✕</button>`;
      li.querySelectorAll(".ibtn").forEach(btn => {
        btn.addEventListener("click", async e => {
          e.stopPropagation();
          const act = btn.dataset.act;
          if(act === "up")   { [state.habits[i-1], state.habits[i]] = [state.habits[i], state.habits[i-1]]; }
          if(act === "down") { [state.habits[i+1], state.habits[i]] = [state.habits[i], state.habits[i+1]]; }
          if(act === "ren")  {
            const name = await appPrompt("Rename habit:", h.name);
            if(!name || !name.trim()) return;
            h.name = name.trim().slice(0, 60);
          }
          if(act === "del")  {
            const ok = await appConfirm(`Delete habit "${h.name}"? Its history is kept.`);
            if(!ok) return;
            state.archived[h.id] = h.name;              // remember name for history view
            state.habits = state.habits.filter(x => x.id !== h.id);
          }
          commitToday();
          renderAll();
        });
      });
    } else {
      // Normal mode: the whole row is a tap target that toggles the check
      li.innerHTML = `<span class="chk">${checked.includes(h.id) ? "✓" : ""}</span>
                      <span class="label">${esc(h.name)}</span>`;
      li.addEventListener("click", () => toggleHabit(h.id));
    }
    list.appendChild(li);
  });
}

function toggleHabit(id){
  const arr = state.checks[currentDay] || (state.checks[currentDay] = []);
  const i = arr.indexOf(id);
  if(i >= 0) arr.splice(i, 1); else arr.push(id);
  commitToday();
  renderHabits();
  renderTodayHeader();
}

function addHabit(){
  const input = $("habitInput");
  const name = input.value.trim();
  if(!name) return;
  state.habits.push({ id: uid(), name: name.slice(0, 60), created: currentDay });
  input.value = "";
  commitToday();
  renderAll();
}

/* ================================================================
   DAILY GOALS — per-day list; a new day starts empty automatically
   because goals are keyed by date. Old days stay in history.
   ================================================================ */
function renderGoals(){
  const list = $("goalList");
  const goals = state.goals[currentDay] || [];
  list.innerHTML = "";

  if(goals.length === 0){
    list.innerHTML = '<li class="dim small" style="padding:10px 4px">No goals for today yet.</li>';
  }

  goals.forEach(g => {
    const li = document.createElement("li");
    li.className = "row" + (g.done ? " done" : "");
    li.innerHTML = `<span class="chk">${g.done ? "✓" : ""}</span>
                    <span class="label">${esc(g.text)}</span>
                    <button class="ibtn" title="Delete goal">✕</button>`;
    li.querySelector(".ibtn").addEventListener("click", e => {
      e.stopPropagation();
      state.goals[currentDay] = goals.filter(x => x.id !== g.id);
      commitToday();
      renderGoals();
      renderTodayHeader();
    });
    li.addEventListener("click", () => {
      g.done = !g.done;
      commitToday();
      renderGoals();
      renderTodayHeader();
    });
    list.appendChild(li);
  });
}

function addGoal(){
  const input = $("goalInput");
  const text = input.value.trim();
  if(!text) return;
  (state.goals[currentDay] || (state.goals[currentDay] = [])).push({ id: uid(), text: text.slice(0, 80), done:false });
  input.value = "";
  commitToday();
  renderGoals();
  renderTodayHeader();
}

/* ================================================================
   CONSISTENCY MATH
   - Per-habit consistency over a date range = days checked / days
     the habit existed in that range (up to today).
   - Overall consistency = average of each day's completion % over
     the elapsed days of the range (days with nothing tracked are
     skipped, matching the calendar colouring).
   ================================================================ */
function* eachDay(fromKey, toKey){
  const end = parseKey(toKey);
  for(let d = parseKey(fromKey); d <= end; d.setDate(d.getDate() + 1)){
    yield keyFor(d);
  }
}

/* clamp a range so it never runs past today */
function clampRange(fromKey, toKey){
  const t = todayKey();
  if(fromKey > t) return null;
  return [fromKey, toKey > t ? t : toKey];
}

function habitConsistency(habit, fromKey, toKey){
  const r = clampRange(fromKey < habit.created ? habit.created : fromKey, toKey);
  if(!r) return null;
  let days = 0, hit = 0;
  for(const k of eachDay(r[0], r[1])){
    days++;
    if((state.checks[k] || []).includes(habit.id)) hit++;
  }
  return days === 0 ? null : Math.round(hit / days * 100);
}

function overallConsistency(fromKey, toKey){
  const r = clampRange(fromKey, toKey);
  if(!r) return null;
  let sum = 0, days = 0;
  for(const k of eachDay(r[0], r[1])){
    const p = pctFor(k);
    if(p !== null){ sum += p; days++; }
  }
  return days === 0 ? null : Math.round(sum / days);
}

/* Render a set of per-habit progress bars into a container */
function renderHabitBars(el, fromKey, toKey){
  if(state.habits.length === 0){
    el.innerHTML = '<p class="dim small">No habits to measure yet.</p>';
    return;
  }
  el.innerHTML = state.habits.map(h => {
    const p = habitConsistency(h, fromKey, toKey);
    const shown = p === null ? 0 : p;
    return `<div class="bar-row">
      <div class="bar-top"><span>${esc(h.name)}</span><span class="muted">${p === null ? "—" : p + "%"}</span></div>
      <div class="bar"><span style="width:${shown}%"></span></div>
    </div>`;
  }).join("");
}

/* ================================================================
   MONTH VIEW — calendar grid, greyscale-coded by completion %
   ================================================================ */
function shadeFor(pct){
  // pct 0-100 → greyscale lightness 8%..85%
  const l = 8 + pct * 0.77;
  return { bg:`hsl(0,0%,${l}%)`, fg: l > 52 ? "#000" : "#fff" };
}

function renderMonth(){
  const y = monthCursor.getFullYear(), m = monthCursor.getMonth();
  $("monthLabel").textContent = MONTHS[m] + " " + y;

  const first = `${y}-${pad(m+1)}-01`;
  const last  = `${y}-${pad(m+1)}-${pad(daysInMonth(y,m))}`;
  const overall = overallConsistency(first, last);
  $("monthPct").textContent = overall === null ? "—" : overall + "%";

  // weekday header (Mon-first)
  $("calHead").innerHTML = ["Mo","Tu","We","Th","Fr","Sa","Su"].map(d => `<span>${d}</span>`).join("");

  const grid = $("calGrid");
  grid.innerHTML = "";
  const lead = (new Date(y, m, 1).getDay() + 6) % 7;   // blanks before day 1 (Mon-first)
  for(let i = 0; i < lead; i++){
    grid.insertAdjacentHTML("beforeend", '<div class="cal-cell blank"></div>');
  }

  const tKey = todayKey();
  for(let day = 1; day <= daysInMonth(y, m); day++){
    const k = `${y}-${pad(m+1)}-${pad(day)}`;
    const cell = document.createElement("div");
    cell.className = "cal-cell";
    cell.textContent = day;

    if(k > tKey){
      cell.classList.add("future");
    } else {
      const p = pctFor(k);
      if(p !== null){
        const s = shadeFor(p);
        cell.style.background = s.bg;
        cell.style.color = s.fg;
      }
      if(k === tKey) cell.classList.add("today");
      cell.addEventListener("click", () => openDay(k));
    }
    grid.appendChild(cell);
  }

  renderHabitBars($("monthHabitBars"), first, last);
}

/* ================================================================
   YEAR VIEW — month-by-month tiles + yearly habit consistency
   ================================================================ */
function renderYear(){
  $("yearLabel").textContent = yearCursor;
  const first = `${yearCursor}-01-01`, last = `${yearCursor}-12-31`;
  const overall = overallConsistency(first, last);
  $("yearPct").textContent = overall === null ? "—" : overall + "%";

  const grid = $("yearGrid");
  grid.innerHTML = "";
  for(let m = 0; m < 12; m++){
    const f = `${yearCursor}-${pad(m+1)}-01`;
    const l = `${yearCursor}-${pad(m+1)}-${pad(daysInMonth(yearCursor, m))}`;
    const p = overallConsistency(f, l);
    const tile = document.createElement("div");
    tile.className = "month-tile";
    tile.innerHTML = `
      <div class="mname">${MONTHS_S[m]}</div>
      <div class="mpct">${p === null ? "—" : p + "%"}</div>
      <div class="mbar"><span style="width:${p === null ? 0 : p}%"></span></div>`;
    // tapping a month jumps to that month's calendar
    tile.addEventListener("click", () => {
      monthCursor = new Date(yearCursor, m, 1);
      switchView("month");
    });
    grid.appendChild(tile);
  }

  renderHabitBars($("yearHabitBars"), first, last);
}

/* ================================================================
   JOURNAL — one entry per day, autosaved, with formatting meta
   ================================================================ */
const FONT_STACKS = {
  system:  '-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif',
  serif:   'Georgia,"Times New Roman",serif',
  mono:    'ui-monospace,"SF Mono",Menlo,Consolas,monospace',
  cursive: '"Snell Roundhand","Segoe Script",cursive'
};
const JOURNAL_DEFAULTS = { text:"", font:"system", size:"16", color:"#f2f2f2", align:"left" };
let saveTimer = null;

function journalFor(dayKey){
  return Object.assign({}, JOURNAL_DEFAULTS, state.journal[dayKey] || {});
}

function applyJournalStyle(el, j){
  el.style.fontFamily = FONT_STACKS[j.font] || FONT_STACKS.system;
  el.style.fontSize   = j.size + "px";
  el.style.color      = j.color;
  el.style.textAlign  = j.align;
}

function renderJournal(){
  const j = journalFor(currentDay);
  const ta = $("journalText");
  ta.value = j.text;
  $("jFont").value = j.font;
  $("jSize").value = j.size;
  $("jColor").value = j.color;
  applyJournalStyle(ta, j);
  highlightAlign(j.align);
}

function highlightAlign(align){
  $("jAlignL").classList.toggle("on", align === "left");
  $("jAlignC").classList.toggle("on", align === "center");
  $("jAlignR").classList.toggle("on", align === "right");
  ["jAlignL","jAlignC","jAlignR"].forEach(id => {
    const on = $(id).classList.contains("on");
    $(id).style.color = on ? "#fff" : "";
    $(id).style.borderColor = on ? "var(--line-hi)" : "";
    $(id).style.boxShadow = on ? "var(--glow-hi)" : "";
  });
}

/* Persist journal text + formatting (debounced for typing) */
function saveJournal(immediate){
  clearTimeout(saveTimer);
  const doSave = () => {
    const j = {
      text:  $("journalText").value,
      font:  $("jFont").value,
      size:  $("jSize").value,
      color: $("jColor").value,
      align: ($("jAlignC").classList.contains("on") ? "center" :
              $("jAlignR").classList.contains("on") ? "right" : "left")
    };
    state.journal[currentDay] = j;
    save();
    const note = $("saveNote");
    note.textContent = "Saved ✓";
    setTimeout(() => { note.textContent = ""; }, 1600);
  };
  if(immediate) doSave(); else saveTimer = setTimeout(doSave, 500);
}

/* ================================================================
   DAY DETAIL MODAL — tap any past day on the calendar
   ================================================================ */
function habitNameFor(id){
  const h = state.habits.find(x => x.id === id);
  return h ? h.name : (state.archived[id] || "(deleted habit)");
}

function openDay(dayKey){
  const d = parseKey(dayKey);
  $("dayTitle").textContent = d.toLocaleDateString(undefined,
    { weekday:"long", year:"numeric", month:"long", day:"numeric" });

  const s = statsFor(dayKey);
  const pct = s.total === 0 ? 0 : Math.round(s.done / s.total * 100);
  $("dayPctLabel").textContent = s.total === 0 ? "Nothing tracked" : pct + "%";
  $("dayPctBar").style.width = pct + "%";

  // habits that existed that day, with their checked state
  const checked = state.checks[dayKey] || [];
  const dayHabits = habitsForDay(dayKey).map(h => ({ name: h.name, done: checked.includes(h.id) }));
  // include checks from since-deleted habits so history stays truthful
  checked.forEach(id => {
    if(!state.habits.some(h => h.id === id)){
      dayHabits.push({ name: habitNameFor(id), done: true });
    }
  });
  $("dayHabits").innerHTML = dayHabits.length === 0
    ? '<li class="dim small" style="padding:8px 4px">No habits existed on this day.</li>'
    : dayHabits.map(h => `<li class="row ${h.done ? "done" : ""}">
        <span class="chk">${h.done ? "✓" : ""}</span><span class="label">${esc(h.name)}</span></li>`).join("");

  const goals = state.goals[dayKey] || [];
  $("dayGoals").innerHTML = goals.length === 0
    ? '<li class="dim small" style="padding:8px 4px">No goals were set.</li>'
    : goals.map(g => `<li class="row ${g.done ? "done" : ""}">
        <span class="chk">${g.done ? "✓" : ""}</span><span class="label">${esc(g.text)}</span></li>`).join("");

  const j = journalFor(dayKey);
  const jv = $("dayJournal");
  jv.textContent = j.text || "No journal entry for this day.";
  jv.classList.toggle("dim", !j.text);
  applyJournalStyle(jv, j.text ? j : JOURNAL_DEFAULTS);

  $("dayOverlay").classList.add("on");
  $("daySheet").scrollTop = 0;
}

/* ================================================================
   EXPORT / IMPORT — JSON backup of everything
   ================================================================ */
function exportData(){
  const blob = new Blob([JSON.stringify(state, null, 2)], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "habit-tracker-backup-" + todayKey() + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

function importData(file){
  const reader = new FileReader();
  reader.onload = async () => {
    try{
      const data = JSON.parse(reader.result);
      // minimal sanity check that this is one of our backups
      if(!data || typeof data !== "object" || !Array.isArray(data.habits)){
        throw new Error("Not a valid habit-tracker backup file.");
      }
      const ok = await appConfirm("Importing replaces ALL current data with the backup. Continue?");
      if(!ok) return;
      state = Object.assign(defaultState(), data);
      save();
      renderAll();
      appAlert("Backup imported ✓");
    }catch(e){
      appAlert("Import failed: " + e.message);
    }
  };
  reader.readAsText(file);
}

/* ================================================================
   VIEW SWITCHING (bottom tab bar)
   ================================================================ */
function switchView(name){
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === "view-" + name));
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.view === name));
  if(name === "month") renderMonth();
  if(name === "year")  renderYear();
  window.scrollTo({ top:0 });
}

/* ================================================================
   MIDNIGHT ROLLOVER
   Checked once a minute and whenever the app regains focus (an iOS
   home-screen app resumes from a frozen state). When the date
   changes: yesterday is already archived (data is keyed per date),
   today simply starts with fresh habit checks, empty goals, an
   empty journal and a new verse.
   ================================================================ */
function checkRollover(){
  const now = todayKey();
  if(now !== currentDay){
    saveJournal(true);          // flush any pending journal edit to the OLD day
    currentDay = now;
    monthCursor = new Date();
    yearCursor = new Date().getFullYear();
    commitToday();
    renderAll();
  }
}

/* ================================================================
   FULL RENDER
   ================================================================ */
function renderAll(){
  renderVerse();
  renderTodayHeader();
  renderHabits();
  renderGoals();
  renderJournal();
  const active = document.querySelector(".view.on");
  if(active && active.id === "view-month") renderMonth();
  if(active && active.id === "view-year")  renderYear();
}

/* ================================================================
   EVENT WIRING
   ================================================================ */
// Habits
$("habitAddBtn").addEventListener("click", addHabit);
$("habitInput").addEventListener("keydown", e => { if(e.key === "Enter") addHabit(); });
$("habitEditBtn").addEventListener("click", () => {
  habitEditMode = !habitEditMode;
  $("habitEditBtn").textContent = habitEditMode ? "Done" : "Edit";
  $("habitEditBtn").classList.toggle("on", habitEditMode);
  renderHabits();
});

// Goals
$("goalAddBtn").addEventListener("click", addGoal);
$("goalInput").addEventListener("keydown", e => { if(e.key === "Enter") addGoal(); });

// Journal: autosave on typing, restyle+save on control change
$("journalText").addEventListener("input", () => saveJournal(false));
["jFont","jSize","jColor"].forEach(id => {
  $(id).addEventListener("change", () => {
    applyJournalStyle($("journalText"), {
      font:$("jFont").value, size:$("jSize").value, color:$("jColor").value,
      align:$("journalText").style.textAlign || "left"
    });
    saveJournal(true);
  });
});
[["jAlignL","left"],["jAlignC","center"],["jAlignR","right"]].forEach(([id, align]) => {
  $(id).addEventListener("click", () => {
    highlightAlign(align);
    $("journalText").style.textAlign = align;
    saveJournal(true);
  });
});

// Month / Year navigation
$("monthPrev").addEventListener("click", () => { monthCursor.setMonth(monthCursor.getMonth()-1); renderMonth(); });
$("monthNext").addEventListener("click", () => { monthCursor.setMonth(monthCursor.getMonth()+1); renderMonth(); });
$("yearPrev").addEventListener("click", () => { yearCursor--; renderYear(); });
$("yearNext").addEventListener("click", () => { yearCursor++; renderYear(); });

// Tabs
document.querySelectorAll(".tab").forEach(t =>
  t.addEventListener("click", () => switchView(t.dataset.view)));

// Day detail modal
$("dayClose").addEventListener("click", () => $("dayOverlay").classList.remove("on"));
$("dayOverlay").addEventListener("click", e => {
  if(e.target === $("dayOverlay")) $("dayOverlay").classList.remove("on");
});

// In-app dialog buttons
$("dlgOk").addEventListener("click", () => closeDialog(true));
$("dlgCancel").addEventListener("click", () => closeDialog(false));
$("dlgInput").addEventListener("keydown", e => { if(e.key === "Enter") closeDialog(true); });
$("dlgOverlay").addEventListener("click", e => {
  if(e.target === $("dlgOverlay")) closeDialog(false);   // tap backdrop = cancel
});

// Backup
$("exportBtn").addEventListener("click", exportData);
$("importBtn").addEventListener("click", () => $("importFile").click());
$("importFile").addEventListener("change", e => {
  if(e.target.files[0]) importData(e.target.files[0]);
  e.target.value = "";   // allow re-importing the same file
});

// Date rollover watchers
setInterval(checkRollover, 60 * 1000);
document.addEventListener("visibilitychange", () => { if(!document.hidden) checkRollover(); });
window.addEventListener("focus", checkRollover);
window.addEventListener("pagehide", () => saveJournal(true));   // flush on close

/* ================================================================
   INIT
   ================================================================ */
commitToday();     // snapshot today immediately so history is never blank
renderAll();
</script>
</body>
</html>
