project_id = "app-name"

[auth]
site_url = "appname://auth-callback"
additional_redirect_urls = ["appname://auth-callback", "exp://**"]

# Called before sign-in; these functions do their own checks.
[functions.login-with-username]
verify_jwt = false

[functions.request-reset]
verify_jwt = false

# Also called by the retry job with a shared secret; it checks the caller itself.
[functions.moderate-post]
verify_jwt = false

# Called by the database and the sweep job with a shared secret; it checks the caller itself.
[functions.send-push]
verify_jwt = false
