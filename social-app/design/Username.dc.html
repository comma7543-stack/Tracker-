<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Username</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#000}a:hover{color:#333}
.btn{display:flex;align-items:center;justify-content:center;height:46px;border-radius:999px;background:#000;color:#fff;font-size:15px;font-weight:600;text-decoration:none;box-sizing:border-box;width:100%;border:0;font-family:inherit}
.btn:hover{color:#fff;background:#262626}
.off{background:#C7C7C7;cursor:default}.off:hover{background:#C7C7C7}
.inp{height:52px;border:1px solid #DBDBDB;border-radius:12px;background:#FAFAFA;padding:0 14px;font-size:16px;color:#000;font-family:inherit;box-sizing:border-box;width:100%}
.inp:focus{outline:none;border-color:#000}
.chip{display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:999px;border:1px solid #DBDBDB;background:#fff;font-family:inherit;font-size:14px;font-weight:600;color:#000;cursor:pointer}
a:focus-visible,button:focus-visible{outline:2px solid #000;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; padding: 0 20px 32px">
<div style="height: 56px; display: flex; align-items: center">
<a href="Birthday.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; margin-left: -10px; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
</div>
<h1 style="font-size: 24px; line-height: 1.25; font-weight: 700; margin: 8px 0">Choose your username</h1>
<p style="font-size: 15px; line-height: 1.4; color: #737373; margin: 0 0 20px">This is how friends find you and see your proof. You can change it later in Settings.</p>
<label for="uname" style="font-size: 12px; color: #737373; margin-bottom: 6px">Username</label>
<input class="inp" id="uname" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Username" value="{{ u }}" onChange="{{ setU }}">
<p style="font-size: 13px; margin: 8px 0 16px; color: {{ noteColor }}">{{ note }}</p>
<div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 28px">
<span style="font-size: 13px; color: #737373">Suggestion</span>
<button class="chip" type="button" onClick="{{ useSuggestion }}">alex.lifts.27</button>
</div>
<sc-if value="{{ valid }}" hint-placeholder-val="{{ false }}">
<a class="btn" href="Terms.dc.html">Next</a>
</sc-if>
<sc-if value="{{ invalid }}" hint-placeholder-val="{{ true }}">
<button class="btn off" type="button" disabled>Next</button>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

let run = '';
words.forEach((w) => { const c = w.replace(/[^a-z]/g, ''); if (c.length === 1) { run += c; } else { if (run.length >= 3) joined.push(run); run = ''; } });
if (run.length >= 3) joined.push(run);
const squashed = words.map((w) => w.replace(/[^a-z]/g, '')).concat(joined);
if (squashed.some((w) => strongRx.some((rx) => rx.test(w)))) return true;

renderVals() {

let noteColor = '#737373';

else if (u.length > 0 && !okChars) { note = 'Usernames can only use letters, numbers, periods and underscores.'; noteColor = '#000000'; }
else if (u.length > 0 && u.length < 3) { note = 'Too short. Use at least 3 characters.'; noteColor = '#000000'; }
else if (valid) { note = u + ' is available.'; noteColor = '#000000'; }

u: u,
note: note,
noteColor: noteColor,
valid: valid,
invalid: !valid,
setU: (e) => this.setState({ u: e.target.value.toLowerCase().replace(/\s/g, '') }),

</script>
