<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forgot password</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#000}a:hover{color:#333}
.btn{display:flex;align-items:center;justify-content:center;height:46px;border-radius:999px;background:#000;color:#fff;font-size:15px;font-weight:600;text-decoration:none;box-sizing:border-box;width:100%;border:0;font-family:inherit;cursor:pointer}
.btn:hover{color:#fff;background:#262626}
.off{background:#C7C7C7;cursor:default}.off:hover{background:#C7C7C7}
.btn2{display:flex;align-items:center;justify-content:center;height:46px;border-radius:999px;background:#fff;color:#000;border:1px solid #DBDBDB;font-size:15px;font-weight:600;text-decoration:none;box-sizing:border-box;width:100%}
.btn2:hover{color:#000;background:#FAFAFA}
.inp{height:52px;border:1px solid #DBDBDB;border-radius:12px;background:#FAFAFA;padding:0 14px;font-size:16px;color:#000;font-family:inherit;box-sizing:border-box;width:100%}
.inp:focus{outline:none;border-color:#000}
a:focus-visible,button:focus-visible{outline:2px solid #000;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; padding: 0 20px 32px">
<div style="height: 56px; display: flex; align-items: center">
<a href="Login.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; margin-left: -10px; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
</div>
<sc-if value="{{ notSent }}" hint-placeholder-val="{{ true }}">
<h1 style="font-size: 24px; line-height: 1.25; font-weight: 700; margin: 8px 0">Reset your password</h1>
<p style="font-size: 15px; line-height: 1.4; color: #737373; margin: 0 0 20px">Tell us your username, email or phone and we'll send you a reset link.</p>
<label for="find" style="font-size: 12px; color: #737373; margin-bottom: 6px">Username, email or phone</label>
<input class="inp" id="find" type="text" autocapitalize="none" placeholder="Username, email or phone" value="{{ v }}" onChange="{{ setV }}">
<div style="height: 24px"></div>
<sc-if value="{{ valid }}" hint-placeholder-val="{{ false }}">
<button class="btn" type="button" onClick="{{ send }}">Send reset link</button>
</sc-if>
<sc-if value="{{ invalid }}" hint-placeholder-val="{{ true }}">
<button class="btn off" type="button" disabled>Send reset link</button>
</sc-if>
</sc-if>
<sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}">
<h1 style="font-size: 24px; line-height: 1.25; font-weight: 700; margin: 8px 0">Check your inbox</h1>
<p style="font-size: 15px; line-height: 1.4; color: #737373; margin: 0 0 24px">If an account matches what you entered, we sent a reset link to it. Demo only: nothing was actually sent.</p>
<a class="btn" href="Login.dc.html">Back to log in</a>
</sc-if>
<div style="flex: 1"></div>
<a class="btn2" href="SignUp.dc.html">New here? Create an account</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const v = s.v || '';
const valid = v.trim().length >= 3;
return {
v: v,
sent: !!s.sent,
notSent: !s.sent,
valid: valid,
invalid: !valid,
setV: (e) => this.setState({ v: e.target.value }),
send: () => this.setState({ sent: true })
};
}
}
</script>
</body>
</html>
