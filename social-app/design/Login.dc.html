<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#000}a:hover{color:#333}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:46px;border-radius:999px;background:#000;color:#fff;font-size:15px;font-weight:600;text-decoration:none;box-sizing:border-box;width:100%;border:0;font-family:inherit}
.btn:hover{color:#fff;background:#262626}
.off{background:#C7C7C7;cursor:default}.off:hover{background:#C7C7C7}
.btn2{display:flex;align-items:center;justify-content:center;gap:10px;height:46px;border-radius:999px;background:#fff;color:#000;border:1px solid #DBDBDB;font-size:15px;font-weight:600;text-decoration:none;box-sizing:border-box;width:100%}
.btn2:hover{color:#000;background:#FAFAFA}
.inp{height:52px;border:1px solid #DBDBDB;border-radius:12px;background:#FAFAFA;padding:0 14px;font-size:16px;color:#000;font-family:inherit;box-sizing:border-box;width:100%}
.inp:focus{outline:none;border-color:#000}
a:focus-visible,button:focus-visible{outline:2px solid #000;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; padding: 0 20px 32px">
<div style="height: 56px; display: flex; align-items: center">
<a href="Main.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; margin-left: -10px; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px; margin: 24px 0 32px">
<div aria-hidden="true" style="width: 64px; height: 64px; border-radius: 18px; border: 2px solid #000000; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; letter-spacing: 0.08em">LOGO</div>
<div style="font-size: 22px; font-weight: 700">[App Name]</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<label for="login-id" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Username, email or phone</label>
<input class="inp" id="login-id" type="text" autocomplete="username" autocapitalize="none" placeholder="Username, email or phone" value="{{ id }}" onChange="{{ setId }}">
<label for="login-pw" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Password</label>
<input class="inp" id="login-pw" type="password" autocomplete="current-password" placeholder="Password" value="{{ pw }}" onChange="{{ setPw }}">
<sc-if value="{{ valid }}" hint-placeholder-val="{{ false }}">
<a class="btn" href="Done.dc.html" style="margin-top: 6px">Log in</a>
</sc-if>
<sc-if value="{{ invalid }}" hint-placeholder-val="{{ true }}">
<button class="btn off" type="button" disabled style="margin-top: 6px">Log in</button>
</sc-if>
<a href="Forgot.dc.html" style="align-self: center; font-size: 14px; font-weight: 600; text-decoration: none; padding: 10px">Forgot password?</a>
</div>
<div style="display: flex; align-items: center; gap: 14px; margin: 8px 0 18px" aria-hidden="true">
<div style="flex: 1; height: 1px; background: #DBDBDB"></div>
<span style="font-size: 13px; font-weight: 600; color: #737373">or</span>
<div style="flex: 1; height: 1px; background: #DBDBDB"></div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<a class="btn2" href="Done.dc.html"><span aria-hidden="true" style="width: 18px; height: 18px; border-radius: 50%; border: 1.5px dashed #737373; box-sizing: border-box"></span>Continue with Apple</a>
<a class="btn2" href="Done.dc.html"><span aria-hidden="true" style="width: 18px; height: 18px; border-radius: 50%; border: 1.5px dashed #737373; box-sizing: border-box"></span>Continue with Google</a>
</div>
<div style="flex: 1"></div>
<a class="btn2" href="SignUp.dc.html">New here? Create an account</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const id = s.id || '';
const pw = s.pw || '';
const valid = id.trim().length > 0 && pw.length > 0;
return {
id: id,
pw: pw,
valid: valid,
invalid: !valid,
setId: (e) => this.setState({ id: e.target.value }),
setPw: (e) => this.setState({ pw: e.target.value })
};
}
}
</script>
</body>
</html>
