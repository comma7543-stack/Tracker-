<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Birthday</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#000}a:hover{color:#333}
.btn{display:flex;align-items:center;justify-content:center;height:46px;border-radius:999px;background:#000;color:#fff;font-size:15px;font-weight:600;text-decoration:none;box-sizing:border-box;width:100%;border:0;font-family:inherit}
.btn:hover{color:#fff;background:#262626}
.off{background:#C7C7C7;cursor:default}.off:hover{background:#C7C7C7}
.inp{height:52px;border:1px solid #DBDBDB;border-radius:12px;background:#FAFAFA;padding:0 14px;font-size:16px;color:#000;font-family:inherit;box-sizing:border-box;width:100%}
.inp:focus{outline:none;border-color:#000}
a:focus-visible,button:focus-visible{outline:2px solid #000;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; padding: 0 20px 32px">
<div style="height: 56px; display: flex; align-items: center">
<a href="NamePassword.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; margin-left: -10px; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
</div>
<h1 style="font-size: 24px; line-height: 1.25; font-weight: 700; margin: 8px 0">When were you born?</h1>
<p style="font-size: 15px; line-height: 1.4; color: #737373; margin: 0 0 20px">Your birthday is never shown on your profile.</p>
<label for="bday" style="font-size: 12px; color: #737373; margin-bottom: 6px">{{ label }}</label>
<input class="inp" id="bday" type="date" value="{{ date }}" onChange="{{ setDate }}" max="{{ today }}">
<sc-if value="{{ tooYoung }}" hint-placeholder-val="{{ false }}">
<div role="alert" style="margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: #F2F2F2; font-size: 14px; line-height: 1.4">You need to be at least 13 to sign up.</div>
</sc-if>
<p style="font-size: 13px; color: #737373; margin: 12px 0 24px">We ask so the app stays age-appropriate. You must be 13 or older to join.</p>
<sc-if value="{{ valid }}" hint-placeholder-val="{{ false }}">
<a class="btn" href="Username.dc.html">Next</a>
</sc-if>
<sc-if value="{{ invalid }}" hint-placeholder-val="{{ true }}">
<button class="btn off" type="button" disabled>Next</button>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const date = (this.state && this.state.date) || '';
const now = new Date();
const pad = (n) => String(n).padStart(2, '0');
let age = null;
if (/^\d{4}-\d{2}-\d{2}$/.test(date)) {
const p = date.split('-').map(Number);
age = now.getFullYear() - p[0];
if (now.getMonth() + 1 < p[1] || (now.getMonth() + 1 === p[1] && now.getDate() < p[2])) age -= 1;
if (age < 0 || age > 120) age = null;
}
const tooYoung = age !== null && age < 13;
const valid = age !== null && !tooYoung;
return {
date: date,
today: now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()),
label: age === null ? 'Birthday' : 'Birthday (' + age + ' years old)',
tooYoung: tooYoung,
valid: valid,
invalid: !valid,
setDate: (e) => this.setState({ date: e.target.value })
};
}
}
</script>
</body>
</html>
